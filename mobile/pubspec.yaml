name: ctc_printer
description: Capture This Coffee - NIIMBOT M2_H BLE label printing for on-set crews
publish_to: "none"
version: 1.0.0+7

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Pinned EXACTLY on purpose: the underlying protocol lib is alpha and its
  # author recommends exact-version pinning. Do not use ^.
  niim_blue_flutter: 1.0.1
  image: ^4.7.1
  http: ^1.2.2
  flutter_secure_storage: 10.3.1
  shared_preferences: ^2.3.3
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/capture-this-smiley.png
    - assets/test_label.png
  fonts:
    # The same faces the server registers in
    # src/lib/niimbot-m2-export-server.ts from public/fonts/. Bundled rather
    # than relying on the iOS system Arial so label metrics are identical in
    # `flutter test` on a host machine and on device.
    #
    # The web renderer asks for weights 700 and 900; only one bold face exists,
    # so both resolve to Arial-Bold on either side. That parity is intentional.
    - family: Arial
      fonts:
        - asset: assets/fonts/Arial.ttf
          weight: 400
        - asset: assets/fonts/Arial-Bold.ttf
          weight: 700
